<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — Jelani's App Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top"><a class="logo" href="/">📱 Jelani's <span>App Store</span></a><nav id="nav"></nav></header>
<main><div class="panel" style="max-width:460px;margin:40px auto">
  <h2>Create account</h2><div id="msg"></div>
  <label class="f">Username (3–20, letters/numbers/_)</label><input class="f" id="u">
  <label class="f">Email</label><input class="f" id="e" type="email">
  <label class="f">Password (8+ characters)</label><input class="f" id="p" type="password" autocomplete="new-password">
  <label class="f">Birthdate — you must be 13 or older</label><input class="f" id="b" type="date">
  <div class="checkline"><input type="checkbox" id="t"><label for="t">I accept the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</label></div>
  <button class="btn" id="go" style="width:100%">Sign up</button>
  <p class="muted">Already have an account? <a href="/login.html">Sign in</a></p>
</div></main>
<script src="/js/common.js"></script>
<script>
document.getElementById('go').onclick = async () => {
  try {
    await api('/api/signup', { method: 'POST', body: {
      username: document.getElementById('u').value, email: document.getElementById('e').value,
      password: document.getElementById('p').value, birthdate: document.getElementById('b').value,
      accept_terms: document.getElementById('t').checked } });
    location.href = '/';
  } catch (e) { showErr(document.getElementById('msg'), e.message); }
};
(async () => { await renderHeader(); })();
</script>
</body>
</html>
