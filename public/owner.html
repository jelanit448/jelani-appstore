<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner console — Jelani's App Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top"><a class="logo" href="/">📱 Jelani's <span>App Store</span></a><nav id="nav"></nav></header>
<main>
  <div id="demo"></div><div id="msg"></div>
  <div class="panel"><h2>Moderation queue</h2><div id="queue"><p class="muted">Loading…</p></div></div>
  <div class="panel"><h2>Cash App orders</h2><div id="cashapp"><p class="muted">Loading…</p></div></div>
  <div class="panel"><h2>App prices</h2><div id="prices"><p class="muted">Loading…</p></div></div>
  <div class="panel"><h2>Finance — every cent reconciled</h2><div id="fin"><p class="muted">Loading…</p></div></div>
</main>
<footer><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · © 2026 Jelani Thompson</footer>
<script src="/js/common.js"></script>
<script>
async function loadQueue() {
  try {
    const d = await api('/api/owner/pending');
    document.getElementById('queue').innerHTML = d.pending.length ? d.pending.map(a => `
      <div class="panel" style="margin:10px 0"><b>${esc(a.name)}</b> v${esc(a.version)} · ${esc(a.category)} · by ${esc(a.developer_name)}
      <br><span class="muted">${esc((a.description || '').slice(0, 200))}</span>
      <br><span class="muted">Price: ${a.price_cents ? '$' + (a.price_cents / 100).toFixed(2) : 'Free'} · ${(a.file_size / 1048576).toFixed(1)} MB · © attested: ${a.copyright_attested ? 'yes' : 'NO'}</span>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="mod(${a.id},true)">Approve</button>
      <button class="btn danger" onclick="mod(${a.id},false)">Reject</button></div></div>`).join('')
      : '<p class="muted">Queue is empty. 🎉</p>';
  } catch (e) { document.getElementById('queue').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function mod(id, approve) {
  const reason = approve ? '' : (prompt('Rejection reason:') || '');
  await api('/api/owner/approve', { method: 'POST', body: { app_id: id, approve, reason } });
  loadQueue();
}
async function loadFin() {
  try {
    const f = await api('/api/owner/finance');
    const t = Object.fromEntries(f.totals.map(x => [x.type, x]));
    const fmt = (c) => '$' + (c / 100).toFixed(2);
    document.getElementById('fin').innerHTML = `
      <table><tr><th>Type</th><th>Count</th><th>Gross</th><th>Platform fees (10%)</th><th>Developer net</th></tr>
      ${f.totals.map(x => `<tr><td>${esc(x.type)}</td><td>${x.n}</td><td>${fmt(x.gross)}</td><td>${fmt(x.fees)}</td><td>${fmt(x.net)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No transactions yet.</td></tr>'}</table>
      <h3>Owed to developers</h3>
      ${f.perDeveloper.length ? `<table><tr><th>Developer</th><th>Owed</th></tr>` + f.perDeveloper.map(p => `<tr><td>${esc(p.developer)}</td><td><b>${fmt(p.owed_cents)}</b></td></tr>`).join('') + `</table>` : '<p class="muted">Nothing owed.</p>'}
      <h3>Reconciliation check</h3>
      ${f.reconciliation.ok
        ? `<div class="okmsg">✅ ${f.reconciliation.checked} ledger row(s) checked — every fee matches the 90/10 split. No missing fees.</div>`
        : `<div class="err">❌ ${f.reconciliation.mismatches.length} problem(s):<br>` + f.reconciliation.mismatches.map(m => `#${m.ledger_id} (${esc(m.type)}): ${esc(m.problem)}`).join('<br>') + `</div>`}
      <p class="muted">Stripe connected: ${f.stripeConfigured ? 'yes' : 'no — demo mode'}. ${esc(f.demoBanner)}</p>`;
  } catch (e) { document.getElementById('fin').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function loadCashapp() {
  try {
    const d = await api('/api/owner/cashapp/orders');
    const open = d.orders.filter(o => o.status === 'pending' || o.status === 'claimed');
    document.getElementById('cashapp').innerHTML = `
      <p class="muted">Your $cashtag: <b>${esc(d.cashtag)}</b> — check Cash App for the payment, then approve. Unverified accounts can receive up to $1,000/month.</p>
      ${open.length ? `<table><tr><th>App</th><th>Buyer</th><th>Amount</th><th>Buyer's $cashtag</th><th>Status</th><th></th></tr>` +
        open.map(o => `<tr><td>${esc(o.app_name)}</td><td>${esc(o.buyer_name)}</td><td>$${(o.amount_cents / 100).toFixed(2)}</td>
        <td>${esc(o.buyer_cashtag || '—')}</td><td>${esc(o.status)}</td>
        <td><button class="btn" onclick="caMod(${o.id},true)" ${o.status !== 'claimed' ? 'disabled' : ''}>Approve</button>
        <button class="btn danger" onclick="caMod(${o.id},false)">Reject</button></td></tr>`).join('') + `</table>`
        : '<p class="muted">No open Cash App orders. 🎉</p>'}`;
  } catch (e) { document.getElementById('cashapp').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function caMod(id, approve) {
  await api(`/api/owner/cashapp/orders/${id}/${approve ? 'approve' : 'reject'}`, { method: 'POST' });
  loadCashapp(); loadFin();
}
async function loadPrices() {
  try {
    const d = await api('/api/owner/apps');
    document.getElementById('prices').innerHTML = `<table><tr><th>App</th><th>Status</th><th>Price</th><th></th></tr>` +
      d.apps.map(a => `<tr><td>${esc(a.name)} v${esc(a.version)}</td><td>${esc(a.status)}</td>
      <td><input class="f" id="price_${a.id}" value="${(a.price_cents / 100).toFixed(2)}" style="max-width:90px"> </td>
      <td><button class="btn" onclick="setPrice(${a.id})">Save</button></td></tr>`).join('') + `</table>
      <p class="muted">Set 0.00 for free. Paid apps can be bought with Stripe (when connected) or Cash App.</p>`;
  } catch (e) { document.getElementById('prices').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function setPrice(id) {
  const v = parseFloat(document.getElementById('price_' + id).value || '0');
  const r = await api(`/api/owner/apps/${id}/price`, { method: 'POST', body: { price_cents: Math.round(v * 100) } });
  alert(`Price set to ${r.price}`);
  loadPrices();
}
(async () => { await renderHeader(); document.getElementById('demo').innerHTML = demoBanner(); await loadQueue(); await loadCashapp(); await loadPrices(); await loadFin(); })();
</script>
</body>
</html>
