<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App — Jelani's App Store</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top"><a class="logo" href="/">📱 Jelani's <span>App Store</span></a><nav id="nav"></nav></header>
<main>
  <div id="demo"></div>
  <div id="msg"></div>
  <div id="app"></div>
  <div class="panel"><h2>Reviews</h2><div id="reviews"></div>
    <div id="revform" style="margin-top:12px"></div>
  </div>
</main>
<footer><a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · © 2026 Jelani Thompson</footer>
<script src="/js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
async function load() {
  const d = await api('/api/apps/' + id);
  const a = d.app;
  document.title = a.name + ' — Jelani\'s App Store';
  document.getElementById('app').innerHTML = `
    <div class="panel"><div class="apphead">
      <img src="/api/apps/${a.id}/icon" alt="">
      <div><h2 style="margin:0">${esc(a.name)}</h2>
      <div class="muted">${esc(a.developer_name)} · ${esc(a.category)} · v${esc(a.version)} · <span class="badge ${a.status}">${a.status}</span></div>
      <div>${stars(a.avg_rating, a.review_count)}</div></div>
    </div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
      <button class="btn" id="shareapp" style="background:#d4af37;color:#111">📤 Send This App</button>
      <a class="btn" id="shareSms" href="#" style="background:#1c1c1c;color:#f5f5f5;text-decoration:none">💬 Text It</a>
      <a class="btn" id="shareWa" href="#" target="_blank" rel="noopener" style="background:#1c1c1c;color:#f5f5f5;text-decoration:none">🟢 WhatsApp</a>
      <button class="btn" id="shareCopy" style="background:#1c1c1c;color:#f5f5f5">📋 Copy Link</button>
    </div>
    <div id="shareMsg" class="muted" style="margin-top:6px"></div>
    <p style="white-space:pre-wrap;margin-top:14px">${esc(a.description)}</p>
    ${(d.screenshots && d.screenshots.length) ? `<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">${d.screenshots.map(s => `<img src="${s}" alt="App picture" style="width:200px;max-width:45vw;border-radius:12px;border:1px solid #333">`).join('')}</div>` : ''}
    <div class="row" style="margin-top:14px">
      ${a.price_cents === 0
        ? `<button class="btn" id="dl">⬇ Download free</button>`
        : (a.owned
          ? `<button class="btn" id="dl">⬇ Download (purchased)</button>`
          : `<button class="btn" id="buy">Buy for $${(a.price_cents / 100).toFixed(2)}</button>
             <button class="btn" id="cashapp" style="background:#00d632">Pay with Cash App</button>
             <div id="paypalbtn" style="margin-top:8px;max-width:340px"></div>`)}
      ${Number(a.id) === 4 ? `<a class="btn" href="/play/east-side-dash.html" style="background:#d4af37;color:#111;text-decoration:none">▶ Play free in browser</a>` : ''}
      <span class="muted">${a.download_count} downloads</span>
    </div>
    <div id="payinfo" class="muted" style="margin-top:8px"></div>
    <div id="cainfo" style="margin-top:8px"></div>
    </div>`;
  const dl = document.getElementById('dl');
  if (dl) dl.onclick = () => { location.href = '/api/apps/' + id + '/download'; setTimeout(load, 1500); };
  // ---- Share THIS app (same choices as the store share page) ----
  const appUrl = location.origin + '/app.html?id=' + a.id;
  const shareText = 'Check out ' + a.name + ' on Jelani\u2019s App Store \u2014 get it here: ' + appUrl;
  const shareMsg = document.getElementById('shareMsg');
  const copyShare = () => {
    const done = () => { shareMsg.textContent = 'Link copied \u2014 paste it to anybody \u2705'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(done, () => {
        const ta = document.createElement('textarea');
        ta.value = shareText; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta); done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = shareText; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  };
  const shBtn = document.getElementById('shareapp');
  if (shBtn) shBtn.onclick = () => {
    if (navigator.share) {
      navigator.share({ title: a.name + ' \u2014 Jelani\u2019s App Store', text: shareText, url: appUrl }).catch(() => {});
    } else { copyShare(); }
  };
  const sSms = document.getElementById('shareSms');
  if (sSms) sSms.href = 'sms:?body=' + encodeURIComponent(shareText);
  const sWa = document.getElementById('shareWa');
  if (sWa) sWa.href = 'https://wa.me/?text=' + encodeURIComponent(shareText);
  const sCp = document.getElementById('shareCopy');
  if (sCp) sCp.onclick = copyShare;
  const buy = document.getElementById('buy');
  if (buy) buy.onclick = async () => {
    const info = document.getElementById('payinfo');
    info.innerHTML = '<span class="muted">Starting checkout…</span>';
    try {
      // Real money: Stripe Checkout (hosted by Stripe — we never see card numbers).
      // Falls back to the demo purchase flow until Stripe is connected.
      try {
        const r = await api('/api/purchase/checkout', { method: 'POST', body: { app_id: Number(id) } });
        location.href = r.checkout_url;
        return;
      } catch (e2) {
        if (/not live yet/i.test(e2.message)) {
          info.innerHTML = '<div class="okmsg">💵 Card checkout isn\'t live yet — use the green <b>Pay with Cash App</b> button above. Real money, no card needed.</div>';
          return;
        }
        if (!/not connected yet|demo mode/i.test(e2.message)) throw e2;
      }
      const r = await api('/api/purchase', { method: 'POST', body: { app_id: Number(id) } });
      info.innerHTML =
        `<div class="okmsg">✅ ${esc(r.demoBanner)}<br>Paid ${esc(r.gross)} → developer ${esc(r.developer_share)} · platform fee ${esc(r.platform_fee)}.</div>`;
      setTimeout(load, 1200);
    } catch (e) {
      info.innerHTML = '';
      showErr(document.getElementById('msg'), e.message);
    }
  };
  if (new URLSearchParams(location.search).get('cancelled') === '1') {
    document.getElementById('payinfo').innerHTML =
      '<div class="muted">Checkout was cancelled — no charge was made.</div>';
  }
  // ---- Manual Cash App payment (no card, no ID needed) ----
  const caBtn = document.getElementById('cashapp');
  if (caBtn) caBtn.onclick = async () => {
    const box = document.getElementById('cainfo');
    box.innerHTML = '<span class="muted">Setting up Cash App payment…</span>';
    try {
      const init = await api('/api/purchase/cashapp/init', { method: 'POST', body: { app_id: Number(id) } });
      if (init.status === 'approved' || init.owned) { load(); return; }
      box.innerHTML = `
        <div class="card" style="margin-top:8px">
          <b>Pay ${esc(init.amount)} with Cash App</b>
          <p class="muted">1. Open Cash App on your phone and send <b>${esc(init.amount)}</b> to <b>${esc(init.cashtag)}</b><br>
          2. Enter <b>your</b> $cashtag below so we can match your payment.</p>
          <input class="f" id="ca_tag" placeholder="$yourcashtag" maxlength="21" style="max-width:240px">
          <button class="btn" id="ca_claim" style="background:#00d632">I've sent the payment</button>
          <div class="muted" id="ca_msg" style="margin-top:6px"></div>
        </div>`;
      document.getElementById('ca_claim').onclick = async () => {
        const msg = document.getElementById('ca_msg');
        const tag = document.getElementById('ca_tag').value.trim();
        msg.textContent = 'Submitting…';
        try {
          await api('/api/purchase/cashapp/claim', { method: 'POST', body: { order_id: init.order_id, buyer_cashtag: tag } });
          msg.innerHTML = '<span class="okmsg">✅ Payment claimed! The owner will verify it and unlock your download — usually within a day.</span>';
          const poll = setInterval(async () => {
            try {
              const s = await api('/api/purchase/cashapp/status?order_id=' + init.order_id);
              if (s.status === 'approved' || s.owned) { clearInterval(poll); load(); }
              else if (s.status === 'rejected') { clearInterval(poll); msg.innerHTML = '<span class="errmsg">This order was not approved. Make sure you sent the payment to the right $cashtag.</span>'; }
            } catch (e) { /* keep polling */ }
          }, 10000);
        } catch (e) { msg.innerHTML = ''; showErr(msg, e.message); }
      };
    } catch (e) { box.innerHTML = ''; showErr(document.getElementById('msg'), e.message); }
  };
  // ---- Pay with PayPal (only rendered when the owner connected it) ----
  // The SDK renders PayPal's own button into #paypalbtn; nothing shows when
  // PayPal is unconfigured, so there is never a dead button.
  async function renderPayPalBtn() {
    const box = document.getElementById('paypalbtn');
    if (!box) return;
    try {
      const cfg = await api('/api/config');
      if (!cfg.paypalConfigured) return;
      const key = await api('/api/paypal/client-id');
      if (!key.client_id) return;
      const s = document.createElement('script');
      s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(key.client_id) + '&currency=USD&intent=capture';
      s.onload = () => {
        try {
          paypal.Buttons({
            createOrder: async () => {
              const r = await api('/api/paypal/create-order', { method: 'POST', body: { app_id: Number(id) } });
              return r.order_id;
            },
            onApprove: async (data) => {
              const info = document.getElementById('payinfo');
              info.innerHTML = '<span class="muted">Confirming PayPal payment…</span>';
              try {
                const r = await api('/api/paypal/capture', { method: 'POST', body: { order_id: data.orderID } });
                info.innerHTML = '<div class="okmsg">✅ PayPal payment confirmed — download unlocked.</div>';
                setTimeout(load, 1200);
              } catch (e) { info.innerHTML = ''; showErr(document.getElementById('msg'), e.message); }
            },
            onError: () => {},
          }).render('#paypalbtn');
        } catch (e) { /* leave the button hidden */ }
      };
      document.head.appendChild(s);
    } catch (e) { /* PayPal stays hidden when unavailable */ }
  }
  renderPayPalBtn();
  document.getElementById('reviews').innerHTML = d.reviews.length
    ? d.reviews.map(r => `<p><b>${esc(r.username)}</b> <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span><br>${esc(r.text)}<br><span class="muted">${esc(r.created_at)}</span></p>`).join('')
    : '<p class="muted">No reviews yet — be the first.</p>';
  const u = await me();
  document.getElementById('revform').innerHTML = u
    ? `<label class="f">Your rating</label><select class="f" id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
       <label class="f">Review</label><textarea class="f" id="rt"></textarea>
       <button class="btn" id="rsend" style="margin-top:8px">Post review</button>`
    : '<p class="muted"><a href="/login.html">Sign in</a> to leave a review.</p>';
  const rs = document.getElementById('rsend');
  if (rs) rs.onclick = async () => {
    try {
      await api('/api/apps/' + id + '/reviews', { method: 'POST', body: { rating: Number(document.getElementById('rr').value), text: document.getElementById('rt').value } });
      load();
    } catch (e) { showErr(document.getElementById('msg'), e.message); }
  };
}
(async () => { await renderHeader(); document.getElementById('demo').innerHTML = demoBanner(); await load(); })();
</script>
</body>
</html>
